<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONETE FIT - Ingresar</title>
<style>
    :root {
        --naranja: #FF5E1A;
        --naranja-glow: rgba(255, 94, 26, 0.5);
        --fondo: #000000;
        --fondo-alt: #0a0a0a;
        --texto: #f2f2f2;
        --texto-tenue: #9a9a9a;
        --error: #FF2E93;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 20%, #1a1a28 0%, var(--fondo) 70%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--texto);
        padding: 24px;
    }
    .card {
        width: 100%;
        max-width: 380px;
        background: var(--fondo-alt);
        border: 1px solid #1f1f1f;
        border-radius: 18px;
        padding: 36px 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
        text-align: center;
        font-size: 26px;
        letter-spacing: 1px;
        margin: 0 0 4px;
        color: var(--naranja);
        text-shadow: 0 0 30px var(--naranja-glow);
    }
    .subt {
        text-align: center;
        color: var(--texto-tenue);
        font-size: 13px;
        margin-bottom: 28px;
    }
    label {
        display: block;
        font-size: 12px;
        color: var(--texto-tenue);
        margin: 16px 0 6px;
    }
    input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 10px;
        border: 1.5px solid #262626;
        background: #000;
        color: var(--texto);
        font-size: 15px;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
        border-color: var(--naranja);
        box-shadow: 0 0 0 3px var(--naranja-glow);
    }
    button {
        width: 100%;
        margin-top: 26px;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--naranja), #e85500);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .3px;
        cursor: pointer;
        box-shadow: 0 8px 24px var(--naranja-glow);
        transition: transform .1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: .6; cursor: default; }
    .msg {
        margin-top: 16px;
        font-size: 13px;
        text-align: center;
        min-height: 18px;
    }
    .msg.error { color: var(--error); }
    .msg.ok { color: #00E676; }
    .abajo {
        margin-top: 22px;
        text-align: center;
        font-size: 13px;
        color: var(--texto-tenue);
    }
    .abajo a {
        color: var(--naranja);
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>PONETE FIT</h1>
        <div class="subt">Panel del profesor</div>

        <form id="formLogin">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" placeholder="tu@mail.com">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

            <button type="submit" id="btnLogin">Ingresar</button>
        </form>

        <div class="msg" id="msg"></div>

        <div class="abajo">
            ¿No tenés cuenta todavía? <a href="/registro">Creá una</a>
        </div>
    </div>

<script>
    const form = document.getElementById('formLogin');
    const btn = document.getElementById('btnLogin');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        msg.className = 'msg';
        btn.disabled = true;
        btn.textContent = 'Ingresando...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.ok) {
                msg.textContent = 'Listo, entrando...';
                msg.className = 'msg ok';
                window.location.href = data.rol === 'admin' ? '/' : '/';
            } else {
                msg.textContent = data.error || 'No se pudo iniciar sesión';
                msg.className = 'msg error';
            }
        } catch (err) {
            msg.textContent = 'Error de conexión. Probá de nuevo.';
            msg.className = 'msg error';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Ingresar';
        }
    });
</script>
</body>
</html>
