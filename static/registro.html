<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONETE FIT - Crear cuenta</title>
<style>
    :root {
        --naranja: #FF5E1A;
        --naranja-glow: rgba(255, 94, 26, 0.5);
        --fondo: #000000;
        --fondo-alt: #0a0a0a;
        --texto: #f2f2f2;
        --texto-tenue: #9a9a9a;
        --error: #FF2E93;
        --verde: #00E676;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 20%, #1a1a28 0%, var(--fondo) 70%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--texto);
        padding: 24px;
    }
    .card {
        width: 100%;
        max-width: 420px;
        background: var(--fondo-alt);
        border: 1px solid #1f1f1f;
        border-radius: 18px;
        padding: 36px 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
        text-align: center;
        font-size: 24px;
        letter-spacing: 1px;
        margin: 0 0 4px;
        color: var(--naranja);
        text-shadow: 0 0 30px var(--naranja-glow);
    }
    .subt {
        text-align: center;
        color: var(--texto-tenue);
        font-size: 13px;
        margin-bottom: 26px;
        line-height: 1.5;
    }
    label {
        display: block;
        font-size: 12px;
        color: var(--texto-tenue);
        margin: 16px 0 6px;
    }
    input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 10px;
        border: 1.5px solid #262626;
        background: #000;
        color: var(--texto);
        font-size: 15px;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
        border-color: var(--naranja);
        box-shadow: 0 0 0 3px var(--naranja-glow);
    }
    .toggle-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 20px;
        padding: 14px;
        background: #000;
        border: 1.5px solid #262626;
        border-radius: 10px;
    }
    .toggle-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-top: 2px;
        accent-color: var(--naranja);
        flex-shrink: 0;
    }
    .toggle-row .txt {
        font-size: 13px;
        color: var(--texto-tenue);
        line-height: 1.45;
    }
    .toggle-row .txt b { color: var(--texto); }
    button {
        width: 100%;
        margin-top: 26px;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--naranja), #e85500);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .3px;
        cursor: pointer;
        box-shadow: 0 8px 24px var(--naranja-glow);
        transition: transform .1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: .6; cursor: default; }
    .msg {
        margin-top: 16px;
        font-size: 13px;
        text-align: center;
        line-height: 1.5;
        min-height: 18px;
    }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--verde); }
    .abajo {
        margin-top: 22px;
        text-align: center;
        font-size: 13px;
        color: var(--texto-tenue);
    }
    .abajo a {
        color: var(--naranja);
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>Crear cuenta</h1>
        <div class="subt">
            Tu cuenta va a quedar pendiente de aprobación de <b>raffa687@gmail.com</b>.
            Te vamos a avisar apenas esté activa.
        </div>

        <form id="formRegistro">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" placeholder="tu@mail.com">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres">

            <label for="password2">Repetir contraseña</label>
            <input type="password" id="password2" required minlength="6" autocomplete="new-password" placeholder="Repetí la contraseña">

            <div class="toggle-row">
                <input type="checkbox" id="quiereVideoteca">
                <div class="txt">
                    <label style="margin:0" for="quiereVideoteca">
                        <b>Quiero arrancar con la videoteca de ejercicios ya cargada</b><br>
                        Se copia una sola vez la videoteca (ejercicios, tips, videos) de la cuenta principal.
                        No se copian alumnos ni rutinas: tu cuenta arranca sin alumnos.
                    </label>
                </div>
            </div>

            <button type="submit" id="btnRegistro">Crear cuenta</button>
        </form>

        <div class="msg" id="msg"></div>

        <div class="abajo">
            ¿Ya tenés cuenta? <a href="/login">Ingresá acá</a>
        </div>
    </div>

<script>
    const form = document.getElementById('formRegistro');
    const btn = document.getElementById('btnRegistro');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        msg.className = 'msg';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;
        const quiereVideoteca = document.getElementById('quiereVideoteca').checked;

        if (password !== password2) {
            msg.textContent = 'Las contraseñas no coinciden';
            msg.className = 'msg error';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creando cuenta...';

        try {
            const res = await fetch('/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, quiere_videoteca: quiereVideoteca })
            });
            const data = await res.json();
            if (data.ok) {
                msg.textContent = data.mensaje + ' Te avisamos por mail apenas puedas ingresar.';
                msg.className = 'msg ok';
                form.reset();
            } else {
                msg.textContent = data.error || 'No se pudo crear la cuenta';
                msg.className = 'msg error';
            }
        } catch (err) {
            msg.textContent = 'Error de conexión. Probá de nuevo.';
            msg.className = 'msg error';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Crear cuenta';
        }
    });
</script>
</body>
</html>
